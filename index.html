<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Secure Call & Chat | AbdTeam</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-between pb-36">

    <!-- HEADER -->
    <header class="p-4 border-b border-gray-800 flex justify-between items-center glass">
        <div class="flex items-center space-x-2">
            <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
            <span class="font-bold text-lg tracking-wider">WebRTC PeerCall & Chat</span>
        </div>
        <div id="user-status" class="text-sm text-gray-400">Авторизация...</div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-grow flex items-center justify-center p-4">
        
        <!-- LOGIN / LOBBY SCREEN -->
        <div id="lobby-screen" class="glass p-8 rounded-2xl shadow-2xl w-full max-w-md text-center space-y-6">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">Добро пожаловать</h1>
            <p class="text-gray-400 text-sm">Введите ваше имя для начала безопасного видеозвонка и чата</p>
            
            <input type="text" id="username-input" placeholder="Ваше имя..." class="w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-xl focus:outline-none focus:border-indigo-500 text-white placeholder-gray-500">
            
            <div class="space-y-3">
                <button id="create-room-btn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-semibold transition shadow-lg shadow-indigo-600/30">Создать комнату</button>
                <div class="flex space-x-2">
                    <input type="text" id="room-id-input" placeholder="Код комнаты..." class="flex-grow px-4 py-3 bg-gray-900 border border-gray-700 rounded-xl focus:outline-none focus:border-indigo-500 text-white placeholder-gray-500 uppercase">
                    <button id="join-room-btn" class="px-6 py-3 bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-xl font-semibold transition">Войти</button>
                </div>
            </div>
        </div>

        <!-- CALL SCREEN -->
        <div id="call-screen" class="hidden w-full max-w-7xl flex flex-col space-y-4">
            <!-- Room Info bar -->
            <div class="glass px-6 py-3 rounded-xl flex justify-between items-center">
                <div>
                    <span class="text-gray-400 text-sm">Комната: </span>
                    <span id="display-room-id" class="font-mono font-bold text-indigo-400 select-all cursor-pointer" title="Нажмите, чтобы скопировать">---</span>
                </div>
                <div id="participants-list" class="text-sm text-gray-300">Участники: На связи</div>
            </div>

            <!-- Content Grid (Video + Chat) -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 h-[65vh]">
                
                <!-- Videos Section (2 columns on lg) -->
                <div class="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4 h-full">
                    <!-- Local Video -->
                    <div class="relative glass rounded-2xl overflow-hidden flex items-center justify-center bg-gray-900 h-full">
                        <video id="local-video" autoplay muted playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
                        <div class="absolute bottom-4 left-4 bg-black/60 px-3 py-1 rounded-lg text-xs font-medium backdrop-blur-md" id="local-name">Вы</div>
                    </div>
                    <!-- Remote Video -->
                    <div class="relative glass rounded-2xl overflow-hidden flex items-center justify-center bg-gray-900 h-full">
                        <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
                        <div class="absolute bottom-4 left-4 bg-black/60 px-3 py-1 rounded-lg text-xs font-medium backdrop-blur-md" id="remote-name">Ожидание участника...</div>
                    </div>
                </div>

                <!-- Chat Panel -->
                <div class="glass rounded-2xl flex flex-col overflow-hidden h-full">
                    <div class="p-3 border-b border-gray-800 font-semibold text-sm text-gray-300 flex items-center justify-between">
                        <span>💬 Чат комнаты</span>
                    </div>
                    <div id="chat-messages" class="flex-grow p-3 overflow-y-auto space-y-3 text-sm flex flex-col"></div>
                    <div class="p-3 border-t border-gray-800 flex space-x-2">
                        <input type="text" id="chat-input" placeholder="Сообщение..." class="flex-grow px-3 py-2 bg-gray-900 border border-gray-700 rounded-xl focus:outline-none focus:border-indigo-500 text-white placeholder-gray-500 text-sm">
                        <button id="send-chat-btn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-semibold transition text-sm">Отпр.</button>
                    </div>
                </div>

            </div>

            <!-- Controls Toolbar -->
            <div class="flex justify-center space-x-4">
                <button id="mic-btn" class="p-4 rounded-2xl glass hover:bg-gray-800 transition text-white">🎤</button>
                <button id="cam-btn" class="p-4 rounded-2xl glass hover:bg-gray-800 transition text-white">📷</button>
                <button id="hangup-btn" class="px-6 py-4 bg-red-600 hover:bg-red-500 rounded-2xl font-semibold transition shadow-lg shadow-red-600/30">Завершить звонок</button>
            </div>
        </div>

    </main>

    <!-- ON-SCREEN DEBUG LOGS PANEL -->
    <div id="debug-logs" class="fixed bottom-0 left-0 right-0 bg-gray-950/95 border-t border-gray-800 p-3 text-xs font-mono text-green-400 z-50 shadow-2xl">
        <div class="flex justify-between items-center border-b border-gray-800 pb-1 mb-1">
            <span class="font-bold text-gray-300 flex items-center space-x-1">
                <span class="w-2 h-2 bg-indigo-500 rounded-full animate-ping"></span>
                <span>🛠️ Логи разработки (GitHub Pages):</span>
            </span>
            <button onclick="document.getElementById('log-content').innerHTML = ''" class="text-gray-500 hover:text-gray-300 underline">Очистить</button>
        </div>
        <div id="log-content" class="space-y-1 max-h-24 overflow-y-auto"></div>
    </div>

    <!-- FOOTER -->
    <footer class="p-4 text-center text-xs text-gray-500 border-t border-gray-800 glass">
        WebRTC & Firestore Signaling by AbdTeam
    </footer>

    <!-- Firebase SDKs (Compat v10) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // Logger function for on-screen debug panel
        function logMsg(message, isError = false) {
            const logContent = document.getElementById('log-content');
            if (!logContent) return;
            const div = document.createElement('div');
            div.className = isError ? 'text-red-400 font-semibold' : 'text-green-400';
            const time = new Date().toLocaleTimeString();
            div.textContent = `[${time}] ${message}`;
            logContent.appendChild(div);
            logContent.scrollTop = logContent.scrollHeight;
            if (isError) {
                console.error(message);
            } else {
                console.log(message);
            }
        }

        logMsg("Инициализация приложения...");

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBxdKuuoBKYKVTmo8r10IfMUk4RTsoOA8g",
            authDomain: "telegraph-123-321.firebaseapp.com",
            projectId: "telegraph-123-321",
            storageBucket: "telegraph-123-321.firebasestorage.app",
            messagingSenderId: "39382080952",
            appId: "1:39382080952:web:0fb2a42caa0a935ffbc34d"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

const servers = {
            iceServers: [
                { urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] },
                {
                    urls: 'turn:openrelay.metered.ca:80',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                },
                {
                    urls: 'turn:openrelay.metered.ca:443',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                }
            ]
        };

        let pc;
        let localStream;
        let remoteStream;
        let roomId = null;
        let currentUser = null;
        let roomRef = null;

        const lobbyScreen = document.getElementById('lobby-screen');
        const callScreen = document.getElementById('call-screen');
        const userStatus = document.getElementById('user-status');
        const usernameInput = document.getElementById('username-input');
        const createRoomBtn = document.getElementById('create-room-btn');
        const joinRoomBtn = document.getElementById('join-room-btn');
        const roomIdInput = document.getElementById('room-id-input');
        const displayRoomId = document.getElementById('display-room-id');
        
        const localVideo = document.getElementById('local-video');
        const remoteVideo = document.getElementById('remote-video');
        const localName = document.getElementById('local-name');
        const remoteName = document.getElementById('remote-name');
        const micBtn = document.getElementById('mic-btn');
        const camBtn = document.getElementById('cam-btn');
        const hangupBtn = document.getElementById('hangup-btn');

        // Chat Elements
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendChatBtn = document.getElementById('send-chat-btn');

        // Anonymous Authentication
        auth.signInAnonymously().then((userCredential) => {
            currentUser = userCredential.user;
            userStatus.textContent = `UID: ${currentUser.uid.substring(0, 6)}...`;
            logMsg(`Успешная анонимная авторизация: ${currentUser.uid}`);
        }).catch((error) => {
            userStatus.textContent = "Ошибка авторизации";
            logMsg(`Ошибка авторизации: ${error.message}`, true);
        });

        // Initialize Media Stream
        async function initLocalStream() {
            try {
                logMsg("Запрос доступа к камере и микрофону...");
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                logMsg("Доступ к медиа устройствам получен.");
            } catch (error) {
                alert('Не удалось получить доступ к камере или микрофону.');
                logMsg(`Ошибка getUserMedia: ${error.message}`, true);
                console.error(error);
            }
        }

        // Initialize Chat Listener
        function initChat() {
            roomRef.collection('messages').orderBy('timestamp').onSnapshot(snapshot => {
                snapshot.docChanges().forEach(change => {
                    if (change.type === 'added') {
                        const msg = change.doc.data();
                        const messageEl = document.createElement('div');
                        messageEl.className = 'flex flex-col space-y-0.5';
                        messageEl.innerHTML = `
                            <span class="font-medium text-indigo-400 text-xs">${escapeHtml(msg.sender)}</span>
                            <div class="bg-gray-900/80 px-3 py-2 rounded-xl text-gray-200 break-words">${escapeHtml(msg.text)}</div>
                        `;
                        chatMessages.appendChild(messageEl);
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                    }
                });
            }, error => {
                logMsg(`Ошибка чата onSnapshot: ${error.message}`, true);
            });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text || !roomRef) return;
            const name = usernameInput.value.trim() || "Гость";
            
            try {
                await roomRef.collection('messages').add({
                    sender: name,
                    text: text,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                chatInput.value = '';
            } catch (err) {
                logMsg(`Ошибка отправки сообщения: ${err.message}`, true);
            }
        }

        sendChatBtn.onclick = sendMessage;
        chatInput.onkeydown = (e) => {
            if (e.key === 'Enter') sendMessage();
        };

        // Helper: Generate short random room code (6 chars, e.g., A7K9X2)
        function generateShortRoomId() {
            return Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        // Create Room (Caller)
        createRoomBtn.onclick = async () => {
            const name = usernameInput.value.trim() || "Гость";
            if (!currentUser) return alert('Подождите завершения авторизации...');
            
            await initLocalStream();
            if (!localStream) return;

            lobbyScreen.classList.add('hidden');
            callScreen.classList.remove('hidden');
            localName.textContent = name;

            roomId = generateShortRoomId();
            roomRef = db.collection('rooms').doc(roomId);
            displayRoomId.textContent = roomId;
            logMsg(`Создана комната с кодом: ${roomId}`);

            initChat();

            pc = new RTCPeerConnection(servers);
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            remoteStream = new MediaStream();
            remoteVideo.srcObject = remoteStream;

pc.ontrack = event => {
    logMsg("Получен медиапоток от собеседника (ontrack)");
    
    // Прямая привязка готового потока и принудительный запуск play() для мобильных
    if (remoteVideo.srcObject !== event.streams[0]) {
        remoteVideo.srcObject = event.streams[0];
        remoteVideo.play().catch(err => {
            logMsg(`Ошибка автозапуска видео: ${err.message}`, true);
        });
    }
    remoteName.textContent = "Собеседник";
};

// Отслеживание реального состояния сетевого соединения WebRTC
pc.oniceconnectionstatechange = () => {
    logMsg(`Статус соединения (ICE): ${pc.iceConnectionState}`);
    if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'disconnected') {
        logMsg("⚠️ Ошибка P2P сети! Телефоны за жестким NAT. Нужен TURN-сервер.", true);
    } else if (pc.iceConnectionState === 'connected') {
        logMsg("✅ P2P соединение успешно установлено!");
    }
};

            const callerCandidatesCollection = roomRef.collection('callerCandidates');
            pc.onicecandidate = event => {
                if (event.candidate) {
                    callerCandidatesCollection.add(event.candidate.toJSON()).catch(err => {
                        logMsg(`Ошибка добавления ICE кандидата (caller): ${err.message}`, true);
                    });
                }
            };

            try {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                logMsg("Создан SDP Offer");

                const roomWithOffer = {
                    offer: { type: offer.type, sdp: offer.sdp },
                    callerName: name
                };
                await roomRef.set(roomWithOffer);
                logMsg("Offer записан в Firestore");
            } catch (err) {
                logMsg(`Ошибка при создании предложения: ${err.message}`, true);
            }

            roomRef.onSnapshot(async snapshot => {
                const data = snapshot.data();
                if (!pc.currentRemoteDescription && data && data.answer) {
                    logMsg("Получен SDP Answer от собеседника");
                    const answer = new RTCSessionDescription(data.answer);
                    await pc.setRemoteDescription(answer);
                    remoteName.textContent = data.calleeName || "Собеседник";
                }
            }, error => {
                logMsg(`Ошибка roomRef snapshot: ${error.message}`, true);
            });

            roomRef.collection('calleeCandidates').onSnapshot(snapshot => {
                snapshot.docChanges().forEach(async change => {
                    if (change.type === 'added') {
                        let data = change.doc.data();
                        try {
                            await pc.addIceCandidate(new RTCIceCandidate(data));
                            logMsg("Добавлен ICE кандидат от callee");
                        } catch (err) {
                            logMsg(`Ошибка добавления ICE (callee candidate): ${err.message}`, true);
                        }
                    }
                });
            });
        };

        // Join Room (Callee)
       // Join Room (Callee)
        joinRoomBtn.onclick = async () => {
            const name = usernameInput.value.trim() || "Гость";
            roomId = roomIdInput.value.trim().toUpperCase();
            if (!roomId) return alert('Введите код комнаты!');
            if (!currentUser) return alert('Подождите завершения авторизации...');

            logMsg(`Попытка входа в комнату: ${roomId}`);
            
            try {
                roomRef = db.collection('rooms').doc(roomId);
                
                // Выводим точный путь в лог на экране, чтобы проверить совпадение
                logMsg(`Точный путь запроса: ${roomRef.path}`);

                const roomSnapshot = await roomRef.get();
                if (!roomSnapshot.exists) {
                    logMsg(`Документ по пути ${roomRef.path} не найден в Firestore!`, true);
                    return alert(`Комната не найдена!\nПуть: ${roomRef.path}`);
                }

                await initLocalStream();
                if (!localStream) return;

                lobbyScreen.classList.add('hidden');
                callScreen.classList.remove('hidden');
                localName.textContent = name;
                displayRoomId.textContent = roomId;
                logMsg(`Успешный доступ к комнате ${roomId}`);

                initChat();

                pc = new RTCPeerConnection(servers);
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

                remoteStream = new MediaStream();
                remoteVideo.srcObject = remoteStream;

                pc.ontrack = event => {
                    logMsg("Получен медиапоток от создателя комнаты (ontrack)");
                    if (remoteVideo.srcObject !== event.streams[0]) {
                        remoteVideo.srcObject = event.streams[0];
                        remoteVideo.play().catch(err => logMsg(`Ошибка play(): ${err.message}`, true));
                    }
                    remoteName.textContent = "Собеседник";
                };

                pc.oniceconnectionstatechange = () => {
                    logMsg(`Статус ICE: ${pc.iceConnectionState}`);
                };

                const calleeCandidatesCollection = roomRef.collection('calleeCandidates');
                pc.onicecandidate = event => {
                    if (event.candidate) {
                        calleeCandidatesCollection.add(event.candidate.toJSON()).catch(err => {
                            logMsg(`Ошибка ICE (callee): ${err.message}`, true);
                        });
                    }
                };

                const roomData = roomSnapshot.data();
                remoteName.textContent = roomData.callerName || "Собеседник";
                
                const offer = roomData.offer;
                await pc.setRemoteDescription(new RTCSessionDescription(offer));
                logMsg("Установлен удаленный SDP Offer");

                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                logMsg("Создан SDP Answer");

                await roomRef.update({
                    answer: { type: answer.type, sdp: answer.sdp },
                    calleeName: name
                });
                logMsg("Answer отправлен в Firestore");

                roomRef.collection('callerCandidates').onSnapshot(snapshot => {
                    snapshot.docChanges().forEach(async change => {
                        if (change.type === 'added') {
                            let data = change.doc.data();
                            try {
                                await pc.addIceCandidate(new RTCIceCandidate(data));
                                logMsg("Добавлен ICE кандидат от caller");
                            } catch (err) {
                                logMsg(`Ошибка ICE (caller): ${err.message}`, true);
                            }
                        }
                    });
                });

            } catch (err) {
                logMsg(`Ошибка при входе в комнату: ${err.message}`, true);
                alert(`Ошибка подключения: ${err.message}`);
            }
        };

        // Controls
        micBtn.onclick = () => {
            const audioTrack = localStream.getAudioTracks()[0];
            audioTrack.enabled = !audioTrack.enabled;
            micBtn.classList.toggle('bg-red-600', !audioTrack.enabled);
            micBtn.textContent = audioTrack.enabled ? '🎤' : '🔇';
            logMsg(`Микрофон: ${audioTrack.enabled ? 'включен' : 'выключен'}`);
        };

        camBtn.onclick = () => {
            const videoTrack = localStream.getVideoTracks()[0];
            videoTrack.enabled = !videoTrack.enabled;
            camBtn.classList.toggle('bg-red-600', !videoTrack.enabled);
            camBtn.textContent = videoTrack.enabled ? '📷' : '🚫';
            logMsg(`Камера: ${videoTrack.enabled ? 'включена' : 'выключена'}`);
        };

        hangupBtn.onclick = () => {
            logMsg("Завершение звонка...");
            if (pc) pc.close();
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            window.location.reload();
        };

        // Copy Room ID on click
        displayRoomId.onclick = () => {
            navigator.clipboard.writeText(roomId);
            alert('Код комнаты скопирован!');
            logMsg(`Код комнаты ${roomId} скопирован в буфер обмена`);
        };
    </script>
</body>
</html>
